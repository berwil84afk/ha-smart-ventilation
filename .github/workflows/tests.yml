name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Die Tests bringen eigene Platzhalter für Home Assistant mit, keine Abhängigkeiten nötig
      - name: Run tests
        run: python -m unittest discover -s tests -v
